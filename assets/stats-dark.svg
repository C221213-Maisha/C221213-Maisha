<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="128" viewBox="0 0 1000 128" role="img" aria-label="2 IEEE conference papers, 15+ student research teams mentored, 280+ students taught over three terms, top 5% of the CSE batch." xmlns:c2pa="http://c2pa.org/manifest">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .big{font-size:32px;font-weight:700;fill:#9DB7D5}
  .lab{font-size:13.5px;fill:#8B949E}
  .c{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
  .u{fill:#D4AC0D;transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:grow .6s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes grow{to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.c{opacity:1}.u{transform:none}}
</style>
<rect x="0.5" y="0.5" width="999" height="127" rx="14" fill="#161B22" stroke="#30363D"/>
<g class="c" style="animation-delay:0.15s">
  <text x="125" y="62" text-anchor="middle" class="big">2</text>
  <text x="125" y="88" text-anchor="middle" class="lab">IEEE conference papers</text>
</g>
<rect class="u" style="animation-delay:0.55s" x="103" y="100" width="44" height="3" rx="1.5"/><line x1="250" y1="30" x2="250" y2="98" stroke="#30363D"/><g class="c" style="animation-delay:0.37s">
  <text x="375" y="62" text-anchor="middle" class="big">15+</text>
  <text x="375" y="88" text-anchor="middle" class="lab">student research teams mentored</text>
</g>
<rect class="u" style="animation-delay:0.77s" x="353" y="100" width="44" height="3" rx="1.5"/><line x1="500" y1="30" x2="500" y2="98" stroke="#30363D"/><g class="c" style="animation-delay:0.59s">
  <text x="625" y="62" text-anchor="middle" class="big">280+</text>
  <text x="625" y="88" text-anchor="middle" class="lab">students taught over three terms</text>
</g>
<rect class="u" style="animation-delay:0.99s" x="603" y="100" width="44" height="3" rx="1.5"/><line x1="750" y1="30" x2="750" y2="98" stroke="#30363D"/><g class="c" style="animation-delay:0.81s">
  <text x="875" y="62" text-anchor="middle" class="big">Top 5%</text>
  <text x="875" y="88" text-anchor="middle" class="lab">of the CSE batch, CGPA 3.73</text>
</g>
<rect class="u" style="animation-delay:1.21s" x="853" y="100" width="44" height="3" rx="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
