<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="StudyDesk: a Django study management platform with a weekly class schedule, a study repository, AI-generated quizzes from PDFs, and goal tracking." xmlns:c2pa="http://c2pa.org/manifest">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .kick{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;fill:#D4AC0D}
  .ttl{font-size:36px;font-weight:700;fill:#E6EDF3}
  .d{font-size:16px;fill:#8B949E}
  .chip{font-size:12.5px;font-weight:600;fill:#E6EDF3}
  .ln{font:10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8B949E}
  .qt{font-size:11.5px;font-weight:600;fill:#E6EDF3}
  .in{opacity:0;animation:in .8s cubic-bezier(.2,.7,.2,1) forwards}
  .blk{opacity:0;transform-box:fill-box;transform-origin:center;animation:blk .5s cubic-bezier(.2,.7,.2,1) forwards}
  .qa{opacity:0}
  .gb{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:gb 8s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes blk{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
  @keyframes gb{0%,10%{transform:scaleX(0)}70%,90%{transform:scaleX(.8)}100%{transform:scaleX(0)}}
  @keyframes q0{0%,20%{opacity:0}23%,90%{opacity:1}96%,100%{opacity:0}}.q0{animation:q0 8s ease-out infinite}@keyframes q1{0%,28%{opacity:0}31%,90%{opacity:1}96%,100%{opacity:0}}.q1{animation:q1 8s ease-out infinite}@keyframes q2{0%,36%{opacity:0}39%,90%{opacity:1}96%,100%{opacity:0}}.q2{animation:q2 8s ease-out infinite}@keyframes q3{0%,44%{opacity:0}47%,90%{opacity:1}96%,100%{opacity:0}}.q3{animation:q3 8s ease-out infinite}@keyframes q4{0%,52%{opacity:0}55%,90%{opacity:1}96%,100%{opacity:0}}.q4{animation:q4 8s ease-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.blk,.qa{opacity:1}.gb{transform:scaleX(.8)}}
</style>
<rect x="0.5" y="0.5" width="999" height="299" rx="16" fill="#161B22" stroke="#30363D"/>
<g class="in" style="animation-delay:.1s"><text x="40" y="66" class="kick">STUDENT PRODUCTIVITY</text></g>
<g class="in" style="animation-delay:.3s"><text x="40" y="112" class="ttl">StudyDesk</text></g>
<g class="in" style="animation-delay:.5s">
  <text x="40" y="150" class="d">One place for a student's week: classes, notes, goals</text>
  <text x="40" y="174" class="d">and AI-generated quizzes from their own PDFs.</text>
</g>
<g class="in" style="animation-delay:.7s"><rect x="40" y="214" width="118" height="28" rx="14" fill="#1C2430" stroke="#30363D"/><text x="99" y="232.5" text-anchor="middle" class="chip">Class schedule</text><rect x="168.2" y="214" width="133" height="28" rx="14" fill="#1C2430" stroke="#30363D"/><text x="235" y="232.5" text-anchor="middle" class="chip">Study repository</text><rect x="311.0" y="214" width="89" height="28" rx="14" fill="#1C2430" stroke="#30363D"/><text x="356" y="232.5" text-anchor="middle" class="chip">AI quizzes</text><rect x="410.0" y="214" width="111" height="28" rx="14" fill="#1C2430" stroke="#30363D"/><text x="465" y="232.5" text-anchor="middle" class="chip">Goal tracking</text></g>
<text x="583" y="50" text-anchor="middle" class="ln">Mon</text><text x="629" y="50" text-anchor="middle" class="ln">Tue</text><text x="675" y="50" text-anchor="middle" class="ln">Wed</text><text x="721" y="50" text-anchor="middle" class="ln">Thu</text><text x="767" y="50" text-anchor="middle" class="ln">Fri</text><line x1="560" y1="58" x2="790" y2="58" stroke="#2A323C"/><line x1="560" y1="84" x2="790" y2="84" stroke="#2A323C"/><line x1="560" y1="110" x2="790" y2="110" stroke="#2A323C"/><line x1="560" y1="136" x2="790" y2="136" stroke="#2A323C"/><line x1="560" y1="162" x2="790" y2="162" stroke="#2A323C"/><line x1="560" y1="188" x2="790" y2="188" stroke="#2A323C"/><rect class="blk" style="animation-delay:0.60s" x="563" y="61" width="40" height="46" rx="5" fill="#9DB7D5" fill-opacity=".85"/><rect class="blk" style="animation-delay:0.78s" x="609" y="87" width="40" height="20" rx="5" fill="#D4AC0D" fill-opacity=".85"/><rect class="blk" style="animation-delay:0.96s" x="655" y="61" width="40" height="20" rx="5" fill="#7FA7D9" fill-opacity=".85"/><rect class="blk" style="animation-delay:1.14s" x="655" y="139" width="40" height="46" rx="5" fill="#9DB7D5" fill-opacity=".85"/><rect class="blk" style="animation-delay:1.32s" x="701" y="113" width="40" height="46" rx="5" fill="#D4AC0D" fill-opacity=".85"/><rect class="blk" style="animation-delay:1.50s" x="747" y="87" width="40" height="20" rx="5" fill="#7FA7D9" fill-opacity=".85"/><rect class="blk" style="animation-delay:1.68s" x="563" y="139" width="40" height="20" rx="5" fill="#9DB7D5" fill-opacity=".85"/><rect class="blk" style="animation-delay:1.86s" x="747" y="165" width="40" height="20" rx="5" fill="#D4AC0D" fill-opacity=".85"/><rect class="blk" style="animation-delay:2.04s" x="609" y="139" width="40" height="20" rx="5" fill="#7FA7D9" fill-opacity=".85"/>
<rect x="830" y="40" width="140" height="168" rx="10" fill="#0D1117" stroke="#30363D"/><text x="842" y="60" class="qt">AI quiz from PDF</text><circle cx="848" cy="78" r="6" fill="none" stroke="#30363D"/><circle class="qa q0" cx="848" cy="78" r="6" fill="#D4AC0D"/><rect x="862" y="75" width="86" height="6" rx="3" fill="#2A323C"/><circle cx="848" cy="102" r="6" fill="none" stroke="#30363D"/><circle class="qa q1" cx="848" cy="102" r="6" fill="#D4AC0D"/><rect x="862" y="99" width="70" height="6" rx="3" fill="#2A323C"/><circle cx="848" cy="126" r="6" fill="none" stroke="#30363D"/><circle class="qa q2" cx="848" cy="126" r="6" fill="#D4AC0D"/><rect x="862" y="123" width="92" height="6" rx="3" fill="#2A323C"/><circle cx="848" cy="150" r="6" fill="none" stroke="#30363D"/><circle class="qa q3" cx="848" cy="150" r="6" fill="#D4AC0D"/><rect x="862" y="147" width="64" height="6" rx="3" fill="#2A323C"/><circle cx="848" cy="174" r="6" fill="none" stroke="#30363D"/><circle class="qa q4" cx="848" cy="174" r="6" fill="#D4AC0D"/><rect x="862" y="171" width="80" height="6" rx="3" fill="#2A323C"/>
<text x="560" y="228" class="ln">Goal: finish chapter notes</text><rect x="560" y="236" width="410" height="8" rx="4" fill="#2A323C"/><rect class="gb" x="560" y="236" width="410" height="8" rx="4" fill="#D4AC0D"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
