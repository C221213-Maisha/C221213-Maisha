<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Problems worked on: fake news detection, evolving graphs, air quality analysis, seismic inversion, research tooling, network simulation, medical imaging with mentored teams, and learning platforms." xmlns:c2pa="http://c2pa.org/manifest">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .ed{fill:none;stroke:#AFC0D2;stroke-width:1.5;animation:draw 1s cubic-bezier(.4,0,.2,1) forwards}
  .bx{opacity:0;animation:pop .6s cubic-bezier(.2,.7,.2,1) forwards}
  .bt{font-size:15px;font-weight:600;fill:#1F2328}
  .bs{font-size:12.5px;fill:#59636E}
  .core{fill:#2C3E50}
  .ring{fill:none;stroke:#B7950B;stroke-width:2;stroke-dasharray:6 8;transform-origin:500px 210px;animation:spin 18s linear infinite}
  .ring2{fill:none;stroke:#B7950B;stroke-opacity:.35;stroke-width:1;transform-origin:500px 210px;animation:breathe 3.2s ease-in-out infinite}
  .ct{font-size:15px;font-weight:600;fill:#FFFFFF}
  .cs{font-size:11px;fill:#D5DEE8;letter-spacing:.3px}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.08);opacity:.9}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.bx{opacity:1}.ed{stroke-dashoffset:0!important}}
</style>
