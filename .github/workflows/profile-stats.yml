name: Profile stats

on:
  schedule:
    - cron: "30 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/scripts/profile-stats.mjs"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build activity cards
        run: node .github/scripts/profile-stats.mjs
        env:
          # METRICS_TOKEN is optional. Without it, only public activity is counted.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          OUT: generated

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update profile activity cards"
            git push
          fi
