<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="PaperPreflight: a private, rule-based pre-submission checker for research papers, scanning a manuscript, flagging three lines and showing a readiness score of 71." xmlns:c2pa="http://c2pa.org/manifest">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .kick{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;fill:#D4AC0D}
  .ttl{font-size:36px;font-weight:700;fill:#E6EDF3}
  .d{font-size:16px;fill:#8B949E}
  .chip{font-size:12.5px;font-weight:600;fill:#E6EDF3}
  .ln{font:9px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8B949E}
  .scan{fill:#D4AC0D;opacity:0;animation:scan 9s cubic-bezier(.4,0,.2,1) infinite}
  .arc{fill:none;stroke:#D4AC0D;stroke-width:7;stroke-linecap:round;stroke-dasharray:276.5;stroke-dashoffset:276.5;transform:rotate(-90deg);transform-origin:925px 150px;animation:arc 9s cubic-bezier(.2,.7,.2,1) infinite}
  .score{font-size:26px;font-weight:700;fill:#E6EDF3;opacity:0;animation:sc 9s ease-out infinite}
  .sl{font-size:11px;fill:#8B949E;letter-spacing:.5px}
  .in{opacity:0;animation:in .8s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes scan{0%{transform:translateY(0);opacity:0}3%{opacity:.9}40%{transform:translateY(180px);opacity:.9}43%,100%{transform:translateY(180px);opacity:0}}
  @keyframes arc{0%,42%{stroke-dashoffset:276.5}58%,92%{stroke-dashoffset:80.2}100%{stroke-dashoffset:276.5}}
  @keyframes sc{0%,50%{opacity:0}58%,92%{opacity:1}100%{opacity:0}}
  @keyframes f0{0%,17.8%{opacity:0}20.8%,92%{opacity:1}97%,100%{opacity:0}}.f0{opacity:0;animation:f0 9s ease-out infinite}@keyframes f1{0%,26.7%{opacity:0}29.7%,92%{opacity:1}97%,100%{opacity:0}}.f1{opacity:0;animation:f1 9s ease-out infinite}@keyframes f2{0%,36.7%{opacity:0}39.7%,92%{opacity:1}97%,100%{opacity:0}}.f2{opacity:0;animation:f2 9s ease-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.score,.f0,.f1,.f2{opacity:1}.arc{stroke-dashoffset:80.2}}
</style>
<rect x="0.5" y="0.5" width="999" height="299" rx="16" fill="#161B22" stroke="#30363D"/>
<g class="in" style="animation-delay:.1s"><text x="40" y="66" class="kick">RESEARCH TOOLING</text></g>
<g class="in" style="animation-delay:.3s"><text x="40" y="112" class="ttl">PaperPreflight</text></g>
<g class="in" style="animation-delay:.5s">
  <text x="40" y="150" class="d">A private, rule-based pre-submission checker for research</text>
  <text x="40" y="174" class="d">papers. It flags the slips reviewers notice first, line by line.</text>
</g>
<g class="in" style="animation-delay:.7s"><rect x="40" y="214" width="155" height="28" rx="14" fill="#1C2430" stroke="#30363D"/><text x="117" y="232.5" text-anchor="middle" class="chip">LaTeX, Word and PDF</text><rect x="204.7" y="214" width="155" height="28" rx="14" fill="#1C2430" stroke="#30363D"/><text x="282" y="232.5" text-anchor="middle" class="chip">Runs in the browser</text><rect x="369.4" y="214" width="89" height="28" rx="14" fill="#1C2430" stroke="#30363D"/><text x="414" y="232.5" text-anchor="middle" class="chip">Rule-based</text><rect x="468.4" y="214" width="89" height="28" rx="14" fill="#1C2430" stroke="#30363D"/><text x="513" y="232.5" text-anchor="middle" class="chip">No API key</text></g>
<rect x="612" y="34" width="250" height="232" rx="10" fill="#0D1117" stroke="#30363D"/>
<rect x="612" y="34" width="250" height="24" rx="10" fill="#1C2430"/>
<rect x="612" y="48" width="250" height="10" fill="#1C2430"/>
<text x="624" y="50" class="ln">paper.tex</text>
<rect x="642" y="74" width="190" height="6" rx="3" fill="#2A323C"/><text x="624" y="80" class="ln">1</text><rect x="642" y="90" width="205" height="6" rx="3" fill="#2A323C"/><text x="624" y="96" class="ln">2</text><rect x="642" y="106" width="170" height="6" rx="3" fill="#2A323C"/><text x="624" y="112" class="ln">3</text><rect x="642" y="122" width="210" height="6" rx="3" fill="#2A323C"/><text x="624" y="128" class="ln">4</text><rect x="642" y="138" width="150" height="6" rx="3" fill="#2A323C"/><text x="624" y="144" class="ln">5</text><rect x="642" y="154" width="198" height="6" rx="3" fill="#2A323C"/><text x="624" y="160" class="ln">6</text><rect x="642" y="170" width="186" height="6" rx="3" fill="#2A323C"/><text x="624" y="176" class="ln">7</text><rect x="642" y="186" width="120" height="6" rx="3" fill="#2A323C"/><text x="624" y="192" class="ln">8</text><rect x="642" y="202" width="204" height="6" rx="3" fill="#2A323C"/><text x="624" y="208" class="ln">9</text><rect x="642" y="218" width="176" height="6" rx="3" fill="#2A323C"/><text x="624" y="224" class="ln">10</text><rect x="642" y="234" width="160" height="6" rx="3" fill="#2A323C"/><text x="624" y="240" class="ln">11</text>
<g class="f0"><rect x="638" y="102" width="178" height="14" rx="4" fill="#F0706A" fill-opacity=".16"/><circle cx="848" cy="109" r="4.5" fill="#F0706A"/></g><g class="f1"><rect x="638" y="150" width="206" height="14" rx="4" fill="#E3A64A" fill-opacity=".16"/><circle cx="848" cy="157" r="4.5" fill="#E3A64A"/></g><g class="f2"><rect x="638" y="214" width="184" height="14" rx="4" fill="#7FA7D9" fill-opacity=".16"/><circle cx="848" cy="221" r="4.5" fill="#7FA7D9"/></g>
<rect class="scan" x="616" y="68" width="242" height="2" rx="1"/>
<circle cx="925" cy="150" r="44" fill="none" stroke="#2A323C" stroke-width="7"/>
<circle class="arc" cx="925" cy="150" r="44"/>
<text x="925" y="159" text-anchor="middle" class="score">71</text>
<text x="925" y="218" text-anchor="middle" class="sl">READINESS</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
